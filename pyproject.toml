[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wx-observer"
version = "0.1.0"
description = "Read-only Windows WeChat 4.x local message history extractor and real-time observer with CLI and MCP server."
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0",
  "zstandard>=0.22",
  "psutil>=5.9",
  "pywin32>=306; sys_platform == 'win32'",
  "mcp>=2.0",
  "pydantic>=2.0",
  "uvicorn>=0.30",
  "starlette>=0.37",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx2>=2.10.0",
]

[project.scripts]
wx-observer = "wx_observer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wx_observer = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
