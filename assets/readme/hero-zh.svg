    <text x="56" y="258" fill="#8B9EB0" font-family="'Cascadia Mono','Consolas','Segoe UI','Microsoft YaHei UI',monospace,sans-serif" font-size="18">
      <tspan fill="#2CC97E" font-weight="700">PS&gt;</tspan><tspan dx="10">CLI 8 子命令</tspan><tspan dx="14" fill="#243240">|</tspan><tspan dx="14">MCP 12 只读工具</tspan><tspan dx="14" fill="#243240">|</tspan><tspan dx="14">4 个场景 Skills</tspan>
