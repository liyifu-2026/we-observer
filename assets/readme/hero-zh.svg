    <circle cx="76" cy="58" r="5" fill="#2CC97E"/>
    <text x="92" y="64" fill="#8B9EB0" font-family="'Cascadia Mono','Consolas','SFMono-Regular',ui-monospace,monospace" font-size="18" letter-spacing="0.3">WINDOWS WECHAT 4.X · LOCAL READ-ONLY</text>

    <text x="56" y="138" fill="#EDF2F7" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',-apple-system,BlinkMacSystemFont,sans-serif" font-size="64" font-weight="700" letter-spacing="-1">wx-observer</text>

