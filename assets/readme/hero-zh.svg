<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">wx-observer — Windows 微信 4.x 本地只读聊天记录提取与观察工具</title>
  <desc id="hero-desc">左侧显示工具定位、一句话说明以及 CLI、MCP、Skills 规模指标；右侧展示 db_storage、DPAPI 密钥缓存与零自动化安全边界。</desc>

  <defs>
    <clipPath id="hero-card-clip">
      <rect x="686" y="42" width="458" height="216" rx="12"/>
    </clipPath>
  </defs>

  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="20" fill="#0B1014" stroke="#243240" stroke-width="1.5"/>

