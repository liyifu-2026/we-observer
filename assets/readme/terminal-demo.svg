<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="term-title term-desc">
  <title id="term-title">wx-observer terminal workflow demo (synthetic data)</title>
  <desc id="term-desc">Sequential demonstration of digest (24h cross-chat summary), search --compact (quote-aware keyword snippet), and mcp --transport stdio startup using synthetic data.</desc>

  <defs>
    <clipPath id="term-frame">
      <rect width="1200" height="560" rx="20"/>
    </clipPath>
  </defs>

