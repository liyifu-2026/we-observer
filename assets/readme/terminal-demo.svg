    <text x="40" y="96" font-family="'Cascadia Mono','Consolas','Microsoft YaHei UI','PingFang SC',ui-monospace,monospace" font-size="19.5"><tspan fill="#2CC97E" font-weight="700">PS&gt;</tspan> <tspan fill="#EDF2F7" font-weight="600">wx-observer</tspan> <tspan fill="#EDF2F7">digest</tspan> <tspan fill="#60A5FA">--since</tspan> <tspan fill="#EDF2F7">24h</tspan> <tspan fill="#60A5FA">--token-budget</tspan> <tspan fill="#EDF2F7">4000</tspan></text>
    <text x="40" y="128" fill="#8B9EB0" font-family="'Cascadia Mono','Consolas','Microsoft YaHei UI','PingFang SC',ui-monospace,monospace" font-size="18">Digest account=<tspan fill="#EDF2F7">wxid_demo_a1b2</tspan> scope=all active_chats=<tspan fill="#EDF2F7">3</tspan> total=<tspan fill="#EDF2F7">84</tspan> signal=<tspan fill="#2CC97E">79</tspan> est_tokens=<tspan fill="#60A5FA">1180</tspan></text>
    <text x="40" y="160" fill="#CBD5E1" font-family="'Cascadia Mono','Consolas','Microsoft YaHei UI','PingFang SC',ui-monospace,monospace" font-size="19">- <tspan fill="#F2C46D">[group]</tspan> <tspan fill="#EDF2F7" font-weight="600">读书小组</tspan> <tspan fill="#8B9EB0">(10001@chatroom): total=42 signal=39</tspan></text>
    <text x="72" y="188" fill="#8B9EB0" font-family="'Cascadia Mono','Consolas','Microsoft YaHei UI','PingFang SC',ui-monospace,monospace" font-size="18.5"><tspan fill="#60A5FA">[05-08 09:30]</tspan> 林 (text): <tspan fill="#EDF2F7">周五一起读第三章。</tspan></text>
    <text x="40" y="219" fill="#CBD5E1" font-family="'Cascadia Mono','Consolas','Microsoft YaHei UI','PingFang SC',ui-monospace,monospace" font-size="19">- <tspan fill="#F2C46D">[group]</tspan> <tspan fill="#EDF2F7" font-weight="600">项目发布群</tspan> <tspan fill="#8B9EB0">(10002@chatroom): total=28 signal=27</tspan></text>
